# Cloudflare Tunnel config. Install to /etc/cloudflared/config.yml and replace
# both TUNNEL_UUID placeholders with the UUID `cloudflared tunnel create`
# printed.
#
# The tunnel dials out to Cloudflare, so the server needs no public IP, no port
# forwarding, and no inbound firewall rule. Nothing but cloudflared can reach
# gunicorn -- it is bound to 127.0.0.1.

tunnel: TUNNEL_UUID
credentials-file: /etc/cloudflared/TUNNEL_UUID.json

ingress:
  - hostname: voicelab.abhijith-sriram.in
    service: http://127.0.0.1:5000
    originRequest:
      # Recordings are up to 8 MB (config.MAX_UPLOAD_BYTES) and feature
      # extraction runs inline on upload, so the default 30 s is too tight.
      connectTimeout: 30s
  # Every request that did not match a hostname above. Required, and must be
  # last.
  - service: http_status:404
